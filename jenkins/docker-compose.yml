services:
  jenkins:
    build: ./
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    group_add:
      - "0"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Europe/Paris
    networks:
      - ci
      - jenkins-net

volumes:
  jenkins_home:

networks:
  ci:
    name: ci-network
  jenkins-net:
    name: jenkins-net
    external: true