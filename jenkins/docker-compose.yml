version: '3.8'

services:
  jenkins:
    build: ./
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Acces au daemon Docker de l'hote pour les stages `docker build`
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Europe/Paris
    networks:
      - ci

volumes:
  jenkins_home:

networks:
  ci:
    name: ci-network
