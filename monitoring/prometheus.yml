global:
  scrape_interval: 15s        # Fréquence de collecte des métriques
  evaluation_interval: 15s

scrape_configs:
  # Prometheus se surveille lui-même (utile pour tester que tout marche)
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Métriques des conteneurs Docker via cAdvisor
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # Métriques système du serveur (CPU, RAM, disque) via Node Exporter
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Métriques du backend Node.js (on ajoutera l'endpoint /metrics côté backend)
  - job_name: "backend"
    static_configs:
      - targets: ["backend:4000"]