services:
  db:
    image: postgres:16-alpine
    container_name: thetiptop_db
    environment:
      POSTGRES_USER: thetiptop
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: thetiptop
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thetiptop"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: thetiptop_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://thetiptop:${DB_PASSWORD:-secret}@db:5432/thetiptop
      JWT_SECRET: ${JWT_SECRET:-change-me-super-secret-key}
      NODE_ENV: production
      PORT: 4000
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    container_name: thetiptop_frontend
    depends_on:
      - backend
    ports:
      - "80:80"

  registry:
    image: registry:2
    container_name: docker-registry
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    networks:
      - jenkins-net

volumes:
  db_data:
  registry-data:

networks:
  jenkins-net:
    name: jenkins-net