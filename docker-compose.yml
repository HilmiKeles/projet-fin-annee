services:
  db:
    image: postgres:16-alpine
    container_name: thetiptop_db
    environment:
      POSTGRES_USER: thetiptop
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: thetiptop
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thetiptop"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: thetiptop_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://thetiptop:${DB_PASSWORD:-secret}@db:5432/thetiptop
      JWT_SECRET: ${JWT_SECRET:-change-me-super-secret-key}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@thetiptop.fr}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      NODE_ENV: production
      PORT: 4000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-349236804300-ri1ua1ahuj1vd14bmf0297gjjgd7r927.apps.googleusercontent.com}
      CAMPAGNE_BUDGET: ${CAMPAGNE_BUDGET:-15000}
    command: sh -c "npx prisma db push --accept-data-loss && node src/index.js"
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-349236804300-ri1ua1ahuj1vd14bmf0297gjjgd7r927.apps.googleusercontent.com}
        VITE_API_URL: /api
    container_name: thetiptop_frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Pas de publication 80/443 : Caddy termine le TLS et proxy vers ce service.
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    container_name: thetiptop_caddy
    restart: unless-stopped
    depends_on:
      - frontend
      - prometheus
      - kibana
      - grafana
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-dsp5-archi-024a-g3.fr}
      ACME_EMAIL: ${ACME_EMAIL:-admin@dsp5-archi-024a-g3.fr}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - jenkins-net

  registry:
    image: registry:2
    container_name: docker-registry
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    networks:
      - jenkins-net

  # Même réseau Docker que Caddy (default + jenkins-net).
  # Pas de publication 8080 sur l'hôte : Caddy proxy vers jenkins:8080.
  jenkins:
    build: ./jenkins
    container_name: jenkins
    restart: unless-stopped
    expose:
      - "8080"
      - "50000"
    # GID de /var/run/docker.sock sur l'hôte (stat -c '%g' /var/run/docker.sock).
    group_add:
      - "${DOCKER_GID:-109}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Europe/Paris
      - JAVA_OPTS=-Xms256m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 180s
    networks:
      - default
      - jenkins-net

  # ─── MONITORING ───────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.external-url=https://prometheus.dsp5-archi-024a-g3.fr/"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    expose:
      - "8080"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_DOMAIN=grafana.dsp5-archi-024a-g3.fr
      - GF_SERVER_ROOT_URL=https://grafana.dsp5-archi-024a-g3.fr/
    restart: unless-stopped

  # ─── LOGS (ELK) ───────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_HOST=0.0.0.0
      - SERVER_PUBLICBASEURL=https://kibana.dsp5-archi-024a-g3.fr
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  registry-data:
  prometheus_data:
  grafana_data:
  elastic_data:
  caddy_data:
  caddy_config:
  jenkins_home:
    name: jenkins_jenkins_home

networks:
  jenkins-net:
    name: jenkins-net